<!-- Low-opacity decorative watermark: opacity is baked into the file itself
     (not applied via CSS) so it works consistently as a plain background-image
     without needing a wrapper element or extra markup. -->
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" opacity="0.07">
  <rect width="600" height="400" fill="#B22234"/>
  <g fill="#FFFFFF">
    <rect y="30.77" width="600" height="30.77"/>
    <rect y="92.31" width="600" height="30.77"/>
    <rect y="153.85" width="600" height="30.77"/>
    <rect y="215.38" width="600" height="30.77"/>
    <rect y="276.92" width="600" height="30.77"/>
    <rect y="338.46" width="600" height="30.77"/>
  </g>
  <rect width="240" height="215.38" fill="#3C3B6E"/>
  <g fill="#FFFFFF">
    <!-- Simplified star field: 9 rows alternating 6/5 dots, standard 50-star layout -->
    <g>
      <!-- rows with 6 stars -->
      <circle cx="20" cy="15" r="4.5"/><circle cx="60" cy="15" r="4.5"/><circle cx="100" cy="15" r="4.5"/><circle cx="140" cy="15" r="4.5"/><circle cx="180" cy="15" r="4.5"/><circle cx="220" cy="15" r="4.5"/>
      <circle cx="20" cy="63" r="4.5"/><circle cx="60" cy="63" r="4.5"/><circle cx="100" cy="63" r="4.5"/><circle cx="140" cy="63" r="4.5"/><circle cx="180" cy="63" r="4.5"/><circle cx="220" cy="63" r="4.5"/>
      <circle cx="20" cy="111" r="4.5"/><circle cx="60" cy="111" r="4.5"/><circle cx="100" cy="111" r="4.5"/><circle cx="140" cy="111" r="4.5"/><circle cx="180" cy="111" r="4.5"/><circle cx="220" cy="111" r="4.5"/>
      <circle cx="20" cy="159" r="4.5"/><circle cx="60" cy="159" r="4.5"/><circle cx="100" cy="159" r="4.5"/><circle cx="140" cy="159" r="4.5"/><circle cx="180" cy="159" r="4.5"/><circle cx="220" cy="159" r="4.5"/>
      <circle cx="20" cy="200" r="4.5"/><circle cx="60" cy="200" r="4.5"/><circle cx="100" cy="200" r="4.5"/><circle cx="140" cy="200" r="4.5"/><circle cx="180" cy="200" r="4.5"/><circle cx="220" cy="200" r="4.5"/>
      <!-- rows with 5 stars, offset -->
      <circle cx="40" cy="39" r="4.5"/><circle cx="80" cy="39" r="4.5"/><circle cx="120" cy="39" r="4.5"/><circle cx="160" cy="39" r="4.5"/><circle cx="200" cy="39" r="4.5"/>
      <circle cx="40" cy="87" r="4.5"/><circle cx="80" cy="87" r="4.5"/><circle cx="120" cy="87" r="4.5"/><circle cx="160" cy="87" r="4.5"/><circle cx="200" cy="87" r="4.5"/>
      <circle cx="40" cy="135" r="4.5"/><circle cx="80" cy="135" r="4.5"/><circle cx="120" cy="135" r="4.5"/><circle cx="160" cy="135" r="4.5"/><circle cx="200" cy="135" r="4.5"/>
      <circle cx="40" cy="182" r="4.5"/><circle cx="80" cy="182" r="4.5"/><circle cx="120" cy="182" r="4.5"/><circle cx="160" cy="182" r="4.5"/><circle cx="200" cy="182" r="4.5"/>
    </g>
