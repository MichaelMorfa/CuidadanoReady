<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#DCEAF3"/>
  <rect width="800" height="450" fill="url(#dots5)" opacity="0.5"/>
  <defs>
    <pattern id="dots5" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1C7FB8" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- subtle flag stripes bottom -->
  <g opacity="0.55">
    <rect x="0" y="382" width="800" height="10" fill="#B22234"/>
    <rect x="0" y="402" width="800" height="10" fill="#B22234"/>
    <rect x="0" y="422" width="800" height="10" fill="#B22234"/>
  </g>

  <!-- certificate -->
  <g transform="translate(250,80)">
    <rect x="0" y="0" width="300" height="220" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="2"/>
    <rect x="16" y="16" width="268" height="188" rx="4" fill="none" stroke="#7FB6D6" stroke-width="3" stroke-dasharray="4 5"/>
    <path d="M150 30 l8 16 l18 3 l-13 12 l3 18 l-16 -9 l-16 9 l3 -18 l-13 -12 l18 -3 Z" fill="#1C7FB8"/>
    <rect x="80" y="100" width="140" height="10" rx="5" fill="#1C222B"/>
    <rect x="95" y="122" width="110" height="8" rx="4" fill="#C9CED6"/>
    <rect x="105" y="140" width="90" height="8" rx="4" fill="#C9CED6"/>
    <line x1="90" y1="176" x2="210" y2="176" stroke="#C9CED6" stroke-width="2"/>
    <text x="150" y="196" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#545C68">CERTIFICATE</text>
  </g>

  <!-- ribbon seal overlapping bottom right of certificate -->
  <g transform="translate(500,210)">
    <circle cx="0" cy="0" r="46" fill="#2F6B4F"/>
    <path d="M0 -22 l7 14 l15 2 l-11 11 l3 16 l-14 -8 l-14 8 l3 -16 l-11 -11 l15 -2 Z" fill="#FFFFFF"/>
    <path d="M-18 34 L-30 68 L-8 58 Z" fill="#145F8C"/>
    <path d="M18 34 L30 68 L8 58 Z" fill="#1C7FB8"/>
  </g>
</svg>
