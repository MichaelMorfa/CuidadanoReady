<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#DEEAE3"/>
  <rect width="800" height="450" fill="url(#dots4)" opacity="0.5"/>
  <defs>
    <pattern id="dots4" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2F6B4F" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- open book -->
  <g transform="translate(190,140)">
    <path d="M0 20 C70 -6 140 -6 210 20 V220 C140 194 70 194 0 220 Z" fill="#FFFFFF" stroke="#C9CED6" stroke-width="2"/>
    <path d="M210 20 C280 -6 350 -6 420 20 V220 C350 194 280 194 210 220 Z" fill="#FFFFFF" stroke="#C9CED6" stroke-width="2"/>
    <path d="M210 20 V220" stroke="#C9CED6" stroke-width="2"/>

    <g stroke="#C9CED6" stroke-width="6" stroke-linecap="round">
      <line x1="30" y1="60" x2="180" y2="46"/>
      <line x1="30" y1="90" x2="180" y2="76"/>
      <line x1="30" y1="120" x2="150" y2="108"/>
    </g>
    <g stroke="#C9CED6" stroke-width="6" stroke-linecap="round">
      <line x1="240" y1="46" x2="390" y2="60"/>
      <line x1="240" y1="76" x2="390" y2="90"/>
      <line x1="240" y1="108" x2="360" y2="120"/>
    </g>
  </g>

  <!-- big ABC letters -->
  <g font-family="'Source Serif 4', Georgia, serif" font-weight="700" fill="#2F6B4F">
    <text x="500" y="300" font-size="90">A</text>
    <text x="580" y="300" font-size="90" fill="#1C7FB8">B</text>
    <text x="660" y="300" font-size="90" fill="#145F8C">C</text>
  </g>

  <!-- pencil -->
  <g transform="translate(560,90) rotate(35)">
    <rect x="0" y="0" width="140" height="26" rx="4" fill="#1C7FB8"/>
    <path d="M140 0 L170 13 L140 26 Z" fill="#1C222B"/>
    <rect x="-16" y="0" width="16" height="26" fill="#DEEAE3" stroke="#C9CED6" stroke-width="2"/>
  </g>
</svg>
