<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#DCEAF3"/>
  <rect width="800" height="450" fill="url(#dots3)" opacity="0.5"/>
  <defs>
    <pattern id="dots3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1C7FB8" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- desk line -->
  <rect x="0" y="330" width="800" height="8" fill="#7FB6D6" opacity="0.5"/>

  <!-- left seated figure (applicant) -->
  <g transform="translate(230,150)">
    <circle cx="0" cy="0" r="46" fill="#145F8C"/>
    <path d="M-70 170 C-70 90 -35 60 0 60 C35 60 70 90 70 170 Z" fill="#145F8C"/>
  </g>

  <!-- right seated figure (officer) -->
  <g transform="translate(570,150)">
    <circle cx="0" cy="0" r="46" fill="#2F6B4F"/>
    <path d="M-70 170 C-70 90 -35 60 0 60 C35 60 70 90 70 170 Z" fill="#2F6B4F"/>
  </g>

  <!-- speech bubble with question mark, from officer -->
  <g transform="translate(455,60)">
    <path d="M0 40 a40 40 0 1 1 20 34 l-14 18 l-2 -22 a40 40 0 0 1 -4 -30 Z" fill="#FFFFFF" stroke="#C9CED6" stroke-width="2"/>
    <text x="40" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#1C7FB8" font-weight="700">?</text>
  </g>

  <!-- speech bubble with check, from applicant -->
  <g transform="translate(290,225)">
    <path d="M60 30 a40 40 0 1 0 -20 34 l14 18 l2 -22 a40 40 0 0 0 4 -30 Z" fill="#FFFFFF" stroke="#C9CED6" stroke-width="2"/>
    <path d="M25 44 l9 9 l16 -19" stroke="#2F6B4F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
